services:
  app:
    container_name: disa-next-apps
    image: config-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: npm run start
    cpus: "1.5"
    mem_limit: 1g
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    expose:
      - "3000"
    networks:
      - dis-core
    restart: on-failure:1000

  nginx:
    container_name: disa-next-nginx-proxy
    image: config-nginx:latest
    build:
      context: .
      dockerfile: config/Dockerfile.nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "3033:80"
    depends_on:
      - app
    networks:
      - disa-core
    restart: unless-stopped

  cloudflared:
    container_name: disa-cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - disa-core
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  disa-core:
    driver: bridge
